[project]
name = "m3dp-filament-recommendation-engine"
version = "1.6.0"
description = "Web-based tool to help select the best FDM 3D printing filament for your project needs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://filament.minimal3dp.com"
Repository = "https://github.com/minimal3dp/m3dp-filament-recommendation-engine"
Documentation = "https://github.com/minimal3dp/m3dp-filament-recommendation-engine#readme"
Issues = "https://github.com/minimal3dp/m3dp-filament-recommendation-engine/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
